<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Request Received | MOS2Career</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #07111f;
      color: #f4f7fb;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(620px, 100%);
      background: #0d1b2a;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #aeb9c9;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 14px;
      color: white;
      text-decoration: none;
      background: #318ce7;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Support Request Received</h1>

    <p>
      Thank you for contacting MOS2Career. Your support request has been
      submitted successfully.
    </p>

    <p>
      Please keep your M2C Reference ID available for any order-related
      questions. We aim to respond within 1–2 business days.
    </p>

    <a href="/">Return to MOS2Career</a>
  </div>

</html>
